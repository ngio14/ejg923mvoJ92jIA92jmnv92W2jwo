<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Zone Clocks</title>
<style>
  :root {
    --bg: #000;
    --teal: #01716E;
    --teal-bright: #0fb5b0;
    --pin: #e0004f;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: Arial, sans-serif; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }

  .map { display: block; width: 100%; max-width: 1000px; height: auto; }
  .land   { fill: rgba(1,113,110,0.14); stroke: #0a9a95; stroke-width: 1.1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .border { fill: none; stroke: var(--teal); stroke-width: 0.6; vector-effect: non-scaling-stroke; opacity: 0.6; }
  .glow   { filter: drop-shadow(0 0 3px rgba(1,113,110,0.9)); }

  .branch-dot { fill: #8fd8ff; opacity: 0.9; }
  .pin-dot  { fill: var(--pin); }
  .pin-ring { fill: none; stroke: var(--pin); stroke-width: 1; transform-box: fill-box; transform-origin: center;
              animation: ping 3s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pin-ring { animation: none; opacity: 0; } }

  .clock-container {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;
    padding: 15px; width: 100%; box-sizing: border-box;
  }
  .clock {
    background: #000; border: 2px solid var(--teal); border-radius: 8px; padding: 5px;
    text-align: center; box-shadow: 0 0 10px rgba(1,113,110,0.9);
    width: 120px; height: 80px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .clock h2 { margin: 0 0 4px; font-size: 12px; color: var(--teal); }
  .clock .time { font-size: 16px; color: var(--teal); font-variant-numeric: tabular-nums; }
  @media (max-width: 768px) { .clock { width: 100px; height: 70px; } }
</style>
</head>

  const branchLayer = document.getElementById('branches');
  BRANCHES.forEach(([name, lat, lon]) => {
    const [x, y] = project(lat, lon);
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('class', 'branch-dot');
    c.setAttribute('cx', x.toFixed(1));
    c.setAttribute('cy', y.toFixed(1));
    c.setAttribute('r', '1.2');
    const t = document.createElementNS(SVG_NS, 'title');
    t.textContent = name;
    c.appendChild(t);
    branchLayer.appendChild(c);
  });

  const pins = document.getElementById('pins');
  SITES.forEach((s, i) => {
    const [x, y] = project(s.lat, s.lon);
    const g = document.createElementNS(SVG_NS, 'g');
    g.innerHTML =
      `<title>${s.name}</title>` +
      `<circle class="pin-ring" cx="${x}" cy="${y}" r="2.2" style="animation-delay:${(i * 0.4) % 3}s"/>` +
      `<circle class="pin-dot" cx="${x}" cy="${y}" r="2.2"/>`;
    pins.appendChild(g);
  });

  const container = document.getElementById('clocks');
  const clocks = SITES.filter(s => s.clock).map(s => {
    const box = document.createElement('div');
    box.className = 'clock';
    box.innerHTML = '<h2></h2><div class="time"></div>';
    container.appendChild(box);
    return { ...s, title: box.querySelector('h2'), display: box.querySelector('.time') };
  });

  function zoneAbbreviation(date, tz, locale) {
    return new Intl.DateTimeFormat(locale, { timeZone: tz, timeZoneName: 'short' })
      .formatToParts(date).find(p => p.type === 'timeZoneName').value;
  }

  function updateClocks() {
    const now = new Date();
    clocks.forEach(c => {
      c.display.textContent = now.toLocaleTimeString('en-GB', {
        timeZone: c.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
      c.title.textContent = `${c.name} (${zoneAbbreviation(now, c.tz, c.labelLocale)})`;
    });
  }
  updateClocks();
  setInterval(updateClocks, 1000);
</script>
