<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Zone Clocks</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background-color: #000;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .logo {
            display: block;
            width: 100%;
            max-width: 1000px;   /* scales down on small screens */
            height: auto;
        }

        .clock-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .clock {
            background: #000;
            border: 2px solid #01716E;
            border-radius: 8px;
            padding: 5px;
            text-align: center;
            box-shadow: 0 0 10px rgba(1, 113, 110, 0.9);
            width: 120px;
            height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .clock h2 {
            margin: 0 0 4px;
            font-size: 12px;
            color: #01716E;
        }

        .clock .time {
            font-size: 16px;
            color: #01716E;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 768px) {
            .clock { width: 100px; height: 70px; }
        }
    </style>
</head>

<body>
    <img src="worldMap.png" alt="World map with office locations" class="logo">

    <div class="clock-container" id="clocks"></div>

    <script>
        // Add, remove, or reorder sites here. labelLocale only controls how the
        // zone abbreviation is written (PDT, BST, CEST, AEST...).
        const CLOCKS = [
            { name: 'Portland',          tz: 'America/Los_Angeles', labelLocale: 'en-US' },
            { name: 'Phoenix',           tz: 'America/Phoenix',     labelLocale: 'en-US' },
            { name: 'Lakeside',          tz: 'America/Chicago',     labelLocale: 'en-US' },
            { name: 'West Chester',      tz: 'America/New_York',    labelLocale: 'en-US' },
            { name: 'United Kingdom',    tz: 'Europe/London',       labelLocale: 'en-GB' },
            { name: 'Germany',           tz: 'Europe/Berlin',       labelLocale: 'en-GB' },
            { name: 'Sydney, Australia', tz: 'Australia/Sydney',    labelLocale: 'en-AU' },
        ];

        const container = document.getElementById('clocks');

        // Build the clock elements once
        CLOCKS.forEach(c => {
            const box = document.createElement('div');
            box.className = 'clock';
            box.innerHTML = '<h2></h2><div class="time"></div>';
            container.appendChild(box);
            c.title = box.querySelector('h2');
            c.display = box.querySelector('.time');
        });

        function zoneAbbreviation(date, tz, locale) {
            const parts = new Intl.DateTimeFormat(locale, {
                timeZone: tz,
                timeZoneName: 'short'
            }).formatToParts(date);
            return parts.find(p => p.type === 'timeZoneName').value;
        }

        function updateClocks() {
            const now = new Date();
            CLOCKS.forEach(c => {
                c.display.textContent = now.toLocaleTimeString('en-GB', {
                    timeZone: c.tz,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });
                c.title.textContent = `${c.name} (${zoneAbbreviation(now, c.tz, c.labelLocale)})`;
            });
        }

        updateClocks();
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
